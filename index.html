<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>QR Studio</h1>
      <p>Generate QR codes instantly in your browser.</p>
    </header>

    <main class="app-shell" aria-label="QR generator app">
      <section class="panel" aria-labelledby="content-heading">
        <h2 id="content-heading">Content</h2>
        <label for="qr-content">Text or URL</label>
        <textarea
          id="qr-content"
          name="qr-content"
          rows="4"
          placeholder="https://example.com"
          aria-describedby="status-message"
        ></textarea>
      </section>

      <section class="panel" aria-labelledby="settings-heading">
        <h2 id="settings-heading">Settings</h2>

        <div class="setting-row">
          <label for="size">Size: <span id="size-value">768</span>px</label>
          <input id="size" name="size" type="range" min="512" max="1024" step="32" value="768" />
          <p class="setting-info">Tips: Bruk 512–1024 for skarp logo og trykk.</p>
        </div>

        <div class="setting-row">
          <label for="ec-level">Error correction</label>
          <select id="ec-level" name="ec-level">
            <option value="L">L (Low)</option>
            <option value="M" selected>M (Medium)</option>
            <option value="Q">Q (Quartile)</option>
            <option value="H">H (High)</option>
          </select>
        </div>

        <div class="setting-row setting-row-inline">
          <label for="fg-color">Foreground</label>
          <input id="fg-color" name="fg-color" type="color" value="#111111" />
        </div>

        <div class="setting-row setting-row-inline">
          <label for="bg-color">Background</label>
          <input id="bg-color" name="bg-color" type="color" value="#ffffff" />
        </div>

        <div class="setting-row">
          <label for="margin">Margin: <span id="margin-value">2</span></label>
          <input id="margin" name="margin" type="range" min="0" max="8" step="1" value="2" />
        </div>

        <div class="setting-row setting-row-checkbox">
          <label for="municipality-logo-toggle">
            <input id="municipality-logo-toggle" name="municipality-logo-toggle" type="checkbox" />
            Vis Tønsberg kommune-logo i QR
          </label>
          <p class="setting-info">
            Når logo brukes settes feilkorreksjon til høyeste nivå (H) for bedre lesbarhet.
          </p>
        </div>

        <div class="settings-actions">
          <button id="generate-btn" type="button">Generate QR</button>
          <button id="reset-btn" type="button">Reset to defaults</button>
        </div>
      </section>

      <section class="panel panel-preview" aria-labelledby="preview-heading">
        <h2 id="preview-heading">Preview</h2>
        <div class="preview-canvas-wrap">
          <div id="qr-preview" aria-label="Generated QR preview"></div>
        </div>

        <div class="actions" aria-label="QR actions">
          <button id="download-btn" type="button" disabled>Download PNG</button>
          <button id="copy-btn" type="button" disabled>Copy image</button>
        </div>

        <p id="status-message" class="hint" role="status">Enter text or URL to generate a QR code.</p>
      </section>
    </main>

    <footer class="site-footer">
      <small>QR Studio PR #7</small>
    </footer>

    <script src="https://unpkg.com/qr-code-styling/lib/qr-code-styling.js" defer></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
