<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>QR Studio</h1>
      <p>Create and customize QR codes in seconds.</p>
    </header>

    <main class="app-shell" aria-label="QR generator placeholder app">
      <section class="panel panel-input" aria-labelledby="content-heading">
        <h2 id="content-heading">1) Content</h2>
        <label for="qr-content">Text or URL</label>
        <textarea
          id="qr-content"
          name="qr-content"
          rows="5"
          placeholder="https://example.com"
          aria-describedby="content-help"
        ></textarea>
        <p id="content-help" class="hint">Placeholder input only (QR generation coming soon).</p>
      </section>

      <section class="panel panel-settings" aria-labelledby="settings-heading">
        <h2 id="settings-heading">2) Settings</h2>
        <div class="setting-row">
          <label for="size">Size</label>
          <select id="size" name="size" disabled>
            <option>256 x 256</option>
            <option>512 x 512</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="foreground">Foreground color</label>
          <input id="foreground" type="color" value="#111111" disabled />
        </div>
        <div class="setting-row">
          <label for="background">Background color</label>
          <input id="background" type="color" value="#ffffff" disabled />
        </div>
      </section>

      <section class="panel panel-preview" aria-labelledby="preview-heading">
        <h2 id="preview-heading">3) Preview</h2>
        <div class="preview-placeholder" role="img" aria-label="QR preview placeholder">
          QR Preview
        </div>
      </section>

      <section class="panel panel-actions" aria-labelledby="actions-heading">
        <h2 id="actions-heading">4) Actions</h2>
        <div class="actions">
          <button type="button" disabled>Generate</button>
          <button type="button" disabled>Download PNG</button>
          <button type="button" disabled>Copy Link</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <small>QR Studio PR #1 scaffold</small>
    </footer>

    <script src="src/app.js"></script>
  </body>
</html>
